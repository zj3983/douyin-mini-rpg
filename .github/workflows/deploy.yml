name: Deploy to Cloud Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  DEPLOY_HOST: 81.69.45.16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          npm ci
          npm run build -- --base=/game/douyin-mini-rpg/
          INDEX_ASSETS="$(cd dist && find assets -maxdepth 1 -type f \( -name 'index-*.js' -o -name 'index-*.css' \) | sort)"
          PUBLIC_ASSETS="$(cd dist && { find assets/generated -maxdepth 1 -type f -name 'evolution-tech-*.svg'; find assets/login -maxdepth 1 -type f \( -name '*.png' -o -name '*.webp' -o -name '*.jpg' -o -name '*.jpeg' \) 2>/dev/null || true; } | sort)"
          tar -czf dist-code.tar.gz -C dist index.html $INDEX_ASSETS $PUBLIC_ASSETS
          tar -czf app.tar.gz dist-code.tar.gz server package.json package-lock.json
          ls -lh dist-code.tar.gz app.tar.gz

      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 5m
          script: |
            set -e
            rm -rf /tmp/douyin-mini-rpg-dist
            mkdir -p /tmp/douyin-mini-rpg-dist

      - name: Upload built archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          source: "app.tar.gz"
          target: "/tmp/douyin-mini-rpg-dist"
          command_timeout: 20m

      - name: Deploy archive and route domain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/var/www/game/douyin-mini-rpg"
            SERVER_DIR="/var/www/game/douyin-mini-rpg-server"
            GAME_HUB_DIR="/var/www/game"
            LEGACY_GAME_DIR="/var/www/game/relaxed-sheep-match"
            sudo mkdir -p "$APP_DIR"
            sudo mkdir -p "$APP_DIR/assets"
            sudo mkdir -p "$SERVER_DIR"
            rm -rf /tmp/douyin-mini-rpg-app
            mkdir -p /tmp/douyin-mini-rpg-app
            tar -xzf /tmp/douyin-mini-rpg-dist/app.tar.gz -C /tmp/douyin-mini-rpg-app
            sudo rm -f "$APP_DIR/index.html"
            sudo find "$APP_DIR/assets" -maxdepth 1 -type f \( -name 'index-*.js' -o -name 'index-*.css' \) -delete
            sudo tar -xzf /tmp/douyin-mini-rpg-app/dist-code.tar.gz -C "$APP_DIR"
            sudo chown -R www-data:www-data "$APP_DIR" || true
            sudo rm -rf "$LEGACY_GAME_DIR"
            sudo tee "$GAME_HUB_DIR/index.html" > /dev/null <<'HTML'
            <!doctype html>
            <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>虚境试炼</title>
              <style>
                body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06111b;color:#eef7ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
                main{width:min(760px,calc(100vw - 32px));padding:28px}
                a{display:block;overflow:hidden;text-decoration:none;color:inherit;border:1px solid rgba(125,219,255,.35);border-radius:14px;background:rgba(6,17,27,.86);box-shadow:0 22px 70px rgba(0,0,0,.35)}
                img{width:100%;height:260px;object-fit:cover;display:block}
                .body{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
                .name{font-size:24px;font-weight:900}.go{color:#8df4ff;font-weight:800}
                p{margin:0 0 18px;color:#b9d7e7}
              </style>
            </head>
            <body>
              <main>
                <p>当前只保留一个游戏入口</p>
                <a href="/game/douyin-mini-rpg/">
                  <img src="/game/douyin-mini-rpg/assets/generated/bg-world-xianxia.png" alt="">
                  <div class="body"><span class="name">虚境试炼</span><span class="go">进入</span></div>
                </a>
              </main>
            </body>
            </html>
            HTML
            sudo chown www-data:www-data "$GAME_HUB_DIR/index.html" || true
            sudo rm -rf "$SERVER_DIR/server"
            sudo cp -R /tmp/douyin-mini-rpg-app/server "$SERVER_DIR/server"
            sudo cp /tmp/douyin-mini-rpg-app/package.json /tmp/douyin-mini-rpg-app/package-lock.json "$SERVER_DIR/"
            sudo mkdir -p "$SERVER_DIR/data"
            sudo chown -R ubuntu:ubuntu "$SERVER_DIR"

            sudo tee /etc/systemd/system/douyin-mini-rpg-api.service > /dev/null <<'SERVICE'
            [Unit]
            Description=Douyin Mini RPG Account API
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/var/www/game/douyin-mini-rpg-server
            Environment=NODE_ENV=production
            Environment=PORT=4174
            Environment=AUTH_DATA_FILE=/var/www/game/douyin-mini-rpg-server/data/auth.json
            ExecStart=/usr/bin/node server/index.js
            Restart=always
            RestartSec=3
            User=ubuntu

            [Install]
            WantedBy=multi-user.target
            SERVICE
            sudo systemctl daemon-reload
            sudo systemctl enable douyin-mini-rpg-api.service
            sudo systemctl restart douyin-mini-rpg-api.service
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4174/api/health | grep -F '"ok":true'; then
                break
              fi
              if [ "$i" = "20" ]; then
                sudo systemctl --no-pager status douyin-mini-rpg-api.service
                exit 1
              fi
              sleep 1
            done

            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf /etc/nginx/conf.d/00-douyin-mini-rpg-live.conf
            sudo find /etc/nginx -type f -name '*.bak-douyin-mini-rpg' -delete
            sudo mkdir -p /tmp/nginx-douyin-mini-rpg-backups
            for BACKUP_CONF in /etc/nginx/conf.d/*.bak /etc/nginx/conf.d/*.bak.* /etc/nginx/conf.d/*.bak-*; do
              if [ -f "$BACKUP_CONF" ] && sudo grep -qE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' "$BACKUP_CONF"; then
                sudo mv "$BACKUP_CONF" "/tmp/nginx-douyin-mini-rpg-backups/$(basename "$BACKUP_CONF")"
              fi
            done

            echo "Current matching nginx snippets:"
            sudo nginx -T 2>/dev/null | grep -nE 'server_name .*mcp\.edcedc\.cn|/game/douyin-mini-rpg|X-Game-Build' -C 2 || true

            NGINX_CONFS="$(mktemp)"
            sudo find /etc/nginx/conf.d /etc/nginx/sites-enabled -maxdepth 1 \( -type f -o -type l \) -print | while IFS= read -r conf; do
              if sudo grep -qE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' "$conf"; then
                echo "$conf"
              fi
            done | sort -u > "$NGINX_CONFS" || true
            if [ ! -s "$NGINX_CONFS" ]; then
              echo "No existing mcp.edcedc.cn config found"
              exit 1
            fi
            echo "Candidate mcp.edcedc.cn configs:"
            cat "$NGINX_CONFS"

            while IFS= read -r NGINX_CONF; do
              sudo cp "$NGINX_CONF" "/tmp/$(basename "$NGINX_CONF").bak-douyin-mini-rpg"
              sudo python3 - "$NGINX_CONF" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            text = path.read_text()
            location = r'''

                location ^~ /game/douyin-mini-rpg/assets/ {
                    alias /var/www/game/douyin-mini-rpg/assets/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/api/ {
                    proxy_pass http://127.0.0.1:4174/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ^~ /game/douyin-mini-rpg/ {
                    alias /var/www/game/douyin-mini-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
                }
            '''

            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/assets/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/api/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            pattern = re.compile(r'(^\s*server_name\s+[^;]*mcp\.edcedc\.cn[^;]*;\s*$)', re.M)
            if not pattern.search(text):
                raise SystemExit('mcp.edcedc.cn server_name not found')
            text = pattern.sub(r'\1' + location, text)
            path.write_text(text)
            PY
              echo "Patched $NGINX_CONF"
            done < "$NGINX_CONFS"
            rm -f "$NGINX_CONFS"

            sudo nginx -t
            sudo nginx -s reload || true

            EXPECTED_JS="$(grep -oE 'index-[^"]+\.js' "$APP_DIR/index.html" | head -n 1)"
            EXPECTED_JS_PATH="$(grep -oE 'assets/index-[^"]+\.js' "$APP_DIR/index.html" | head -n 1)"
            PUBLIC_HOST_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/?deploy-check=1)"
            echo "$PUBLIC_HOST_HTML" | grep -F "$EXPECTED_JS"
            curl -fsSI -H 'Host: mcp.edcedc.cn' "http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/$EXPECTED_JS_PATH" | tee /tmp/douyin-mini-rpg-js.headers
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/assets/generated/world-moss-hills.webp | tee /tmp/douyin-mini-rpg-public-asset.headers
            grep -qi 'content-type: image/webp' /tmp/douyin-mini-rpg-public-asset.headers
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/assets/generated/evolution-tech-thunder-cloud.svg | tee /tmp/douyin-mini-rpg-evolution-asset.headers
            grep -qi 'content-type: image/svg' /tmp/douyin-mini-rpg-evolution-asset.headers
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/assets/login/login-bg-xianxia.png | tee /tmp/douyin-mini-rpg-login-asset.headers
            grep -qi 'content-type: image/png' /tmp/douyin-mini-rpg-login-asset.headers
            PUBLIC_GAME_HUB="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/?deploy-check=1)"
            echo "$PUBLIC_GAME_HUB" | grep -F '虚境试炼'
            if echo "$PUBLIC_GAME_HUB" | grep -F 'relaxed-sheep-match'; then
              echo "Legacy game entry still present"
              exit 1
            fi
            if curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/relaxed-sheep-match/; then
              echo "Legacy game directory still reachable"
              exit 1
            fi
            for i in $(seq 1 20); do
              if curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/api/health | grep -F '"ok":true'; then
                break
              fi
              if [ "$i" = "20" ]; then
                exit 1
              fi
              sleep 1
            done
            echo "Deployed archive to $APP_DIR on ${{ env.DEPLOY_HOST }}"
