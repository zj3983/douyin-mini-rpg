name: Deploy to Cloud Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  DEPLOY_HOST: 81.69.45.16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          npm ci
          npm run build -- --base=/game/douyin-mini-rpg/
          tar -czf dist-code.tar.gz -C dist index.html $(cd dist && find assets -maxdepth 1 -type f \( -name 'index-*.js' -o -name 'index-*.css' \))
          ls -lh dist-code.tar.gz

      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 5m
          script: |
            set -e
            rm -rf /tmp/douyin-mini-rpg-dist
            mkdir -p /tmp/douyin-mini-rpg-dist

      - name: Upload built archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          source: "dist-code.tar.gz"
          target: "/tmp/douyin-mini-rpg-dist"
          command_timeout: 20m

      - name: Deploy archive and route domain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/var/www/game/douyin-mini-rpg"
            sudo mkdir -p "$APP_DIR"
            sudo mkdir -p "$APP_DIR/assets"
            sudo rm -f "$APP_DIR/index.html"
            sudo find "$APP_DIR/assets" -maxdepth 1 -type f \( -name 'index-*.js' -o -name 'index-*.css' \) -delete
            sudo tar -xzf /tmp/douyin-mini-rpg-dist/dist-code.tar.gz -C "$APP_DIR"
            sudo chown -R www-data:www-data "$APP_DIR" || true

            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf /etc/nginx/conf.d/00-douyin-mini-rpg-live.conf
            sudo find /etc/nginx -type f -name '*.bak-douyin-mini-rpg' -delete
            sudo mkdir -p /tmp/nginx-douyin-mini-rpg-backups
            for BACKUP_CONF in /etc/nginx/conf.d/*.bak /etc/nginx/conf.d/*.bak.* /etc/nginx/conf.d/*.bak-*; do
              if [ -f "$BACKUP_CONF" ] && sudo grep -qE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' "$BACKUP_CONF"; then
                sudo mv "$BACKUP_CONF" "/tmp/nginx-douyin-mini-rpg-backups/$(basename "$BACKUP_CONF")"
              fi
            done

            echo "Current matching nginx snippets:"
            sudo nginx -T 2>/dev/null | grep -nE 'server_name .*mcp\.edcedc\.cn|/game/douyin-mini-rpg|X-Game-Build' -C 2 || true

            NGINX_CONFS="$(mktemp)"
            sudo find /etc/nginx/conf.d /etc/nginx/sites-enabled -maxdepth 1 \( -type f -o -type l \) -print | while IFS= read -r conf; do
              if sudo grep -qE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' "$conf"; then
                echo "$conf"
              fi
            done | sort -u > "$NGINX_CONFS" || true
            if [ ! -s "$NGINX_CONFS" ]; then
              echo "No existing mcp.edcedc.cn config found"
              exit 1
            fi
            echo "Candidate mcp.edcedc.cn configs:"
            cat "$NGINX_CONFS"

            while IFS= read -r NGINX_CONF; do
              sudo cp "$NGINX_CONF" "/tmp/$(basename "$NGINX_CONF").bak-douyin-mini-rpg"
              sudo python3 - "$NGINX_CONF" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            text = path.read_text()
            location = r'''

                location ^~ /game/douyin-mini-rpg/assets/ {
                    alias /var/www/game/douyin-mini-rpg/assets/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/ {
                    alias /var/www/game/douyin-mini-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
                }
            '''

            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/assets/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            pattern = re.compile(r'(^\s*server_name\s+[^;]*mcp\.edcedc\.cn[^;]*;\s*$)', re.M)
            if not pattern.search(text):
                raise SystemExit('mcp.edcedc.cn server_name not found')
            text = pattern.sub(r'\1' + location, text)
            path.write_text(text)
            PY
              echo "Patched $NGINX_CONF"
            done < "$NGINX_CONFS"
            rm -f "$NGINX_CONFS"

            sudo nginx -t
            sudo nginx -s reload || true

            EXPECTED_JS="$(grep -oE 'index-[^"]+\.js' "$APP_DIR/index.html" | head -n 1)"
            EXPECTED_JS_PATH="$(grep -oE 'assets/index-[^"]+\.js' "$APP_DIR/index.html" | head -n 1)"
            PUBLIC_HOST_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/?deploy-check=1)"
            echo "$PUBLIC_HOST_HTML" | grep -F "$EXPECTED_JS"
            curl -fsSI -H 'Host: mcp.edcedc.cn' "http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/$EXPECTED_JS_PATH" | tee /tmp/douyin-mini-rpg-js.headers
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/assets/generated/world-moss-hills.webp | tee /tmp/douyin-mini-rpg-public-asset.headers
            grep -qi 'content-type: image/webp' /tmp/douyin-mini-rpg-public-asset.headers
            echo "Deployed archive to $APP_DIR on ${{ env.DEPLOY_HOST }}"
