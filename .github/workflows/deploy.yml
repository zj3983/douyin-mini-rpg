name: Deploy to Cloud Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  DEPLOY_HOST: 81.69.45.16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image-test dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Package checked Cocos build
        run: |
          npm ci
          npm test
          cd cocos-client
          npm test
          COCOS_CREATOR_PATH=prebuilt npm run build:check
          COCOS_CREATOR_PATH=prebuilt npm run verify:build-output -- build/web-mobile
          cd ..

      - name: Checkout release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 5m
          script: |
            set -e
            rm -rf /tmp/douyin-mini-rpg-app
            git clone --depth 1 --branch main https://github.com/zj3983/douyin-mini-rpg.git /tmp/douyin-mini-rpg-app
            test "$(git -C /tmp/douyin-mini-rpg-app rev-parse HEAD)" = "${{ github.sha }}"

      - name: Deploy archive and route domain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/var/www/game/douyin-mini-rpg"
            SERVER_DIR="/var/www/game/douyin-mini-rpg-server"
            GAME_HUB_DIR="/var/www/games-prefix"
            LEGACY_GAME_DIR="/var/www/game/relaxed-sheep-match"
            LEGACY_PREFIX_DIR="/var/www/games-prefix/relaxed-sheep-match"

            sudo rm -rf "$APP_DIR"
            sudo mkdir -p "$APP_DIR" "$SERVER_DIR" "$GAME_HUB_DIR"
            sudo cp -R /tmp/douyin-mini-rpg-app/cocos-client/build/web-mobile/. "$APP_DIR/"
            sudo chown -R www-data:www-data "$APP_DIR" || true

            sudo rm -rf "$LEGACY_GAME_DIR" "$LEGACY_PREFIX_DIR"
            sudo tee "$GAME_HUB_DIR/index.html" > /dev/null <<'HTML'
            <!doctype html>
            <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Void Trial</title>
              <style>
                body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06111b;color:#eef7ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
                main{width:min(760px,calc(100vw - 32px));padding:28px}
                a{display:block;text-decoration:none;color:inherit;border:1px solid rgba(125,219,255,.35);border-radius:14px;background:rgba(6,17,27,.86);box-shadow:0 22px 70px rgba(0,0,0,.35)}
                .body{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
                .name{font-size:24px;font-weight:900}.go{color:#8df4ff;font-weight:800}
                p{margin:0 0 18px;color:#b9d7e7}
              </style>
            </head>
            <body>
              <main>
                <p>Current game entry</p>
                <a href="/game/douyin-mini-rpg/">
                  <div class="body"><span class="name">Void Trial</span><span class="go">Enter</span></div>
                </a>
              </main>
            </body>
            </html>
            HTML
            sudo chown www-data:www-data "$GAME_HUB_DIR/index.html" || true

            if [ -d "$LEGACY_GAME_DIR" ] || [ -d "$LEGACY_PREFIX_DIR" ]; then
              echo "Legacy game files still exist"
              exit 1
            fi

            sudo rm -rf "$SERVER_DIR/server"
            sudo cp -R /tmp/douyin-mini-rpg-app/server "$SERVER_DIR/server"
            sudo cp /tmp/douyin-mini-rpg-app/package.json /tmp/douyin-mini-rpg-app/package-lock.json "$SERVER_DIR/"
            sudo mkdir -p "$SERVER_DIR/data"
            sudo chown -R ubuntu:ubuntu "$SERVER_DIR"

            sudo tee /etc/systemd/system/douyin-mini-rpg-api.service > /dev/null <<'SERVICE'
            [Unit]
            Description=Douyin Mini RPG Account API
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/var/www/game/douyin-mini-rpg-server
            Environment=NODE_ENV=production
            Environment=PORT=4174
            Environment=AUTH_DATA_FILE=/var/www/game/douyin-mini-rpg-server/data/auth.json
            ExecStart=/usr/bin/node server/index.js
            Restart=always
            RestartSec=3
            User=ubuntu

            [Install]
            WantedBy=multi-user.target
            SERVICE
            sudo systemctl daemon-reload
            sudo systemctl enable douyin-mini-rpg-api.service
            sudo systemctl restart douyin-mini-rpg-api.service
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4174/api/health | grep -F '"ok":true'; then
                break
              fi
              if [ "$i" = "20" ]; then
                sudo systemctl --no-pager status douyin-mini-rpg-api.service
                exit 1
              fi
              sleep 1
            done

            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf /etc/nginx/conf.d/00-douyin-mini-rpg-live.conf
            sudo find /etc/nginx -type f -name '*.bak-douyin-mini-rpg' -delete

            NGINX_CONFS="$(mktemp)"
            sudo find /etc/nginx/conf.d /etc/nginx/sites-enabled -maxdepth 1 \( -type f -o -type l \) -print | while IFS= read -r conf; do
              if sudo grep -qE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' "$conf"; then
                echo "$conf"
              fi
            done | sort -u > "$NGINX_CONFS" || true
            if [ ! -s "$NGINX_CONFS" ]; then
              echo "No existing mcp.edcedc.cn config found"
              exit 1
            fi

            while IFS= read -r NGINX_CONF; do
              sudo cp "$NGINX_CONF" "/tmp/$(basename "$NGINX_CONF").bak-douyin-mini-rpg"
              sudo python3 - "$NGINX_CONF" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            text = path.read_bytes().decode('utf-8')
            compression = r'''

                # BEGIN douyin-mini-rpg compression
                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_comp_level 6;
                gzip_min_length 1024;
                gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml application/wasm;
                # END douyin-mini-rpg compression
            '''
            location = r'''

                location ^~ /game/douyin-mini-rpg/assets/ {
                    alias /var/www/game/douyin-mini-rpg/assets/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/cocos-js/ {
                    alias /var/www/game/douyin-mini-rpg/cocos-js/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/src/ {
                    alias /var/www/game/douyin-mini-rpg/src/;
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/api/ {
                    proxy_pass http://127.0.0.1:4174/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ^~ /game/douyin-mini-rpg/ {
                    alias /var/www/game/douyin-mini-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
                }
            '''

            managed_name = 'douyin-mini-rpg compression'
            managed_pattern = re.compile(
                r'(?:\n[ \t]*)+# BEGIN ' + re.escape(managed_name)
                + r'[ \t]*\n.*?\n[ \t]*# END ' + re.escape(managed_name)
                + r'[ \t]*(?=\n)',
                re.S,
            )
            server_name_pattern = re.compile(r'(^[ \t]*server_name[ \t]+[^;]*mcp\.edcedc\.cn[^;]*;[ \t]*$)', re.M)

            def skip_quoted(source, index):
                quote = source[index]
                index += 1
                while index < len(source):
                    if source[index] == '\\':
                        index += 2
                    elif source[index] == quote:
                        return index + 1
                    else:
                        index += 1
                raise SystemExit('unterminated quoted string in nginx config')

            def skip_comment(source, index):
                newline = source.find('\n', index)
                return len(source) if newline < 0 else newline + 1

            def find_block_end(source, opening):
                depth = 0
                index = opening
                while index < len(source):
                    char = source[index]
                    if char in "'\"":
                        index = skip_quoted(source, index)
                    elif char == '#':
                        index = skip_comment(source, index)
                    elif char == '\\':
                        index += 2
                    else:
                        if char == '{':
                            depth += 1
                        elif char == '}':
                            depth -= 1
                            if depth == 0:
                                return index + 1
                        index += 1
                raise SystemExit('unbalanced nginx server block')

            def server_spans(source):
                spans = []
                index = 0
                while index < len(source):
                    char = source[index]
                    if char in "'\"":
                        index = skip_quoted(source, index)
                        continue
                    if char == '#':
                        index = skip_comment(source, index)
                        continue
                    if char == '\\':
                        index += 2
                        continue
                    if source.startswith('server', index):
                        before = source[index - 1] if index else ''
                        after_index = index + len('server')
                        after = source[after_index] if after_index < len(source) else ''
                        if not (before.isalnum() or before in '_-') and not (after.isalnum() or after in '_-'):
                            opening = after_index
                            while opening < len(source):
                                if source[opening].isspace():
                                    opening += 1
                                elif source[opening] == '#':
                                    opening = skip_comment(source, opening)
                                else:
                                    break
                            if opening < len(source) and source[opening] == '{':
                                end = find_block_end(source, opening)
                                spans.append((index, end))
                                index = end
                                continue
                    index += 1
                return spans

            matching_spans = [
                (start, end)
                for start, end in server_spans(text)
                if server_name_pattern.search(text[start:end])
            ]
            if not matching_spans:
                raise SystemExit('mcp.edcedc.cn server_name not found')

            for start, end in reversed(matching_spans):
                block = text[start:end]
                block = managed_pattern.sub('', block)
                for route in ["assets", "cocos-js", "src", "api", ""]:
                    escaped = re.escape(f"/game/douyin-mini-rpg/{route}") if route else re.escape("/game/douyin-mini-rpg/")
                    block = re.sub(rf'\n\s*location\s+(?:=\s+|\^~\s+)?{escaped}(?:/)?\s*\{{.*?\n[ \t]*\}}[ \t]*(?:\n[ \t]*(?=\n))*', '', block, flags=re.S)
                block = server_name_pattern.sub(r'\1' + compression + location, block, count=1)
                text = text[:start] + block + text[end:]

            path.write_bytes(text.encode('utf-8'))
            PY
              echo "Patched $NGINX_CONF"
            done < "$NGINX_CONFS"
            rm -f "$NGINX_CONFS"

            sudo nginx -t
            sudo nginx -s reload || true

            JS_FILE="$(find "$APP_DIR/cocos-js" -type f -name '*.js' -printf '%s\t%P\n' | sort -nr | head -n 1 | cut -f2-)"
            if [ -z "$JS_FILE" ]; then
              echo "No deployed cocos-js JavaScript file found"
              exit 1
            fi
            JS_URL="/game/douyin-mini-rpg/cocos-js/$JS_FILE"
            GZIP_HEADERS="$(mktemp)"
            trap 'rm -f "$GZIP_HEADERS"' EXIT
            curl -fsS -D "$GZIP_HEADERS" -o /dev/null -H 'Host: mcp.edcedc.cn' -H 'Accept-Encoding: gzip' "http://${{ env.DEPLOY_HOST }}$JS_URL"
            grep -qiE '^Content-Encoding:[[:space:]]*gzip([[:space:]]|\r)*$' "$GZIP_HEADERS"
            grep -qiE '^Vary:.*Accept-Encoding' "$GZIP_HEADERS"
            grep -qiE '^Cache-Control:.*public.*max-age=2592000.*immutable' "$GZIP_HEADERS"
            rm -f "$GZIP_HEADERS"
            trap - EXIT

            PUBLIC_HOST_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/?deploy-check=1)"
            echo "$PUBLIC_HOST_HTML" | grep -F 'Cocos3dGameContainer'
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/style.css | grep -qi 'content-type: text/css'
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/src/settings.json | grep -qi 'content-type: application/json'
            PUBLIC_GAME_HUB="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/?deploy-check=1)"
            echo "$PUBLIC_GAME_HUB" | grep -F 'Void Trial'
            if echo "$PUBLIC_GAME_HUB" | grep -F 'relaxed-sheep-match'; then
              echo "Legacy game entry still present"
              exit 1
            fi
            LEGACY_PUBLIC_PAGE="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/relaxed-sheep-match/?deploy-check=1 || true)"
            if echo "$LEGACY_PUBLIC_PAGE" | grep -E 'Relaxed Sheep Match|relaxed-sheep-match'; then
              echo "Legacy game content still reachable"
              exit 1
            fi
            for i in $(seq 1 20); do
              if curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/api/health | grep -F '"ok":true'; then
                break
              fi
              if [ "$i" = "20" ]; then
                exit 1
              fi
              sleep 1
            done
            echo "Deployed Cocos archive to $APP_DIR on ${{ env.DEPLOY_HOST }}"
