name: Deploy to Cloud Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build -- --base=/game/douyin-mini-rpg/
          tar -czf dist.tar.gz -C dist .

      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: |
            rm -rf /tmp/douyin-mini-rpg-dist
            mkdir -p /tmp/douyin-mini-rpg-dist

      - name: Upload built archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          source: "dist.tar.gz"
          target: "/tmp/douyin-mini-rpg-dist"

      - name: Deploy to live game directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            APP_DIR="$(sudo find /var/www -type f -path '*/game/douyin-mini-rpg/index.html' -print -quit | xargs -r dirname)"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$(sudo find /var/www -type f -path '*/douyin-mini-rpg/index.html' -print -quit | xargs -r dirname)"
            fi
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/var/www/game/douyin-mini-rpg"
            fi
            sudo mkdir -p "$APP_DIR"
            sudo rm -rf "$APP_DIR"/*
            sudo tar -xzf /tmp/douyin-mini-rpg-dist/dist.tar.gz -C "$APP_DIR"
            sudo chown -R www-data:www-data "$APP_DIR" || true
            sudo nginx -t
            sudo nginx -s reload || true
            echo "Deployed to $APP_DIR"
            echo "Visit http://mcp.edcedc.cn/game/douyin-mini-rpg/"
