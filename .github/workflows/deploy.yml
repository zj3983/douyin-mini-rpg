name: Deploy to Cloud Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 20m
          script: |
            set -e

            REPO_URL="https://github.com/${{ github.repository }}.git"
            REPO_DIR="/tmp/douyin-mini-rpg-src"
            COMMIT="${{ github.sha }}"

            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y git
            fi

            if ! command -v node >/dev/null 2>&1 || ! node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 20 ? 0 : 1)" >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch --depth 1 origin "$COMMIT"
              git reset --hard FETCH_HEAD
            else
              rm -rf "$REPO_DIR"
              git clone --depth 1 "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
              git fetch --depth 1 origin "$COMMIT"
              git reset --hard FETCH_HEAD
            fi

            npm install
            npm run build -- --base=/game/douyin-mini-rpg/

            LIVE_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://127.0.0.1/game/douyin-mini-rpg/ || true)"
            LIVE_HASH="$(printf '%s' "$LIVE_HTML" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)"
            LIVE_DIR=""
            if [ -n "$LIVE_HASH" ]; then
              LIVE_INDEX="$(sudo grep -Rsl "$LIVE_HASH" /var/www /usr/share/nginx/html 2>/dev/null | head -n 1 || true)"
              if [ -n "$LIVE_INDEX" ]; then
                LIVE_DIR="$(dirname "$LIVE_INDEX")"
              fi
            fi

            FOUND_DIRS="$(sudo find /var/www /usr/share/nginx/html -type f -path '*/douyin-mini-rpg/index.html' -print 2>/dev/null | xargs -r -n1 dirname | sort -u || true)"
            DEPLOY_TARGETS="$(printf '%s\n%s\n%s\n' "$LIVE_DIR" "$FOUND_DIRS" "/var/www/game/douyin-mini-rpg" | sed '/^$/d' | sort -u)"

            printf '%s\n' "$DEPLOY_TARGETS" | while IFS= read -r APP_DIR; do
              sudo mkdir -p "$APP_DIR"
              sudo rm -rf "$APP_DIR"/*
              sudo cp -a dist/. "$APP_DIR"/
              sudo chown -R www-data:www-data "$APP_DIR" || true
              echo "Synced $APP_DIR"
            done

            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf
            NGINX_CONF="$(sudo grep -RslE 'server_name[[:space:]].*mcp\.edcedc\.cn' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)"
            if [ -n "$NGINX_CONF" ]; then
              sudo cp "$NGINX_CONF" "$NGINX_CONF.bak-douyin-mini-rpg"
              sudo python3 - "$NGINX_CONF" <<'PY'
from pathlib import Path
import re
import sys

path = Path(sys.argv[1])
text = path.read_text()
location = """

    location ^~ /game/douyin-mini-rpg/assets/ {
        alias /var/www/game/douyin-mini-rpg/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /game/douyin-mini-rpg/ {
        alias /var/www/game/douyin-mini-rpg/;
        index index.html;
        try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
    }
"""

text = re.sub(r'\n\s*location\s+\^~\s+/game/douyin-mini-rpg/assets/\s*\{[^{}]*\}', '', text)
text = re.sub(r'\n\s*location\s+\^~\s+/game/douyin-mini-rpg/\s*\{[^{}]*\}', '', text)
pattern = re.compile(r'(^\s*server_name\s+[^;]*mcp\.edcedc\.cn[^;]*;\s*$)', re.MULTILINE)
if not pattern.search(text):
    raise SystemExit('mcp.edcedc.cn server_name not found')
text = pattern.sub(r'\1' + location, text, count=1)
path.write_text(text)
PY
              echo "Patched $NGINX_CONF for /game/douyin-mini-rpg/"
            fi
            sudo nginx -t
            sudo nginx -s reload || true

            echo "Deployed commit $COMMIT"
            echo "Visit http://mcp.edcedc.cn/game/douyin-mini-rpg/"
