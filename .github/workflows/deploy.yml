name: Deploy to Cloud Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Route live domain to deployed game
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 5m
          script: |
            set -e

            test -f /var/www/game/douyin-mini-rpg/index.html
            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf /etc/nginx/conf.d/00-douyin-mini-rpg-live.conf
            sudo find /etc/nginx -type f -name '*.bak-douyin-mini-rpg' -delete

            echo "Current matching nginx snippets:"
            sudo nginx -T 2>/dev/null | grep -nE 'server_name .*mcp\.edcedc\.cn|/game/douyin-mini-rpg|X-Game-Build' -C 2 || true

            NGINX_CONFS="$(mktemp)"
            sudo grep -RslE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' /etc/nginx 2>/dev/null | sort -u > "$NGINX_CONFS" || true
            if [ ! -s "$NGINX_CONFS" ]; then
              echo "No existing mcp.edcedc.cn config found"
              exit 1
            fi
            echo "Candidate mcp.edcedc.cn configs:"
            cat "$NGINX_CONFS"

            while IFS= read -r NGINX_CONF; do
              sudo cp "$NGINX_CONF" "/tmp/$(basename "$NGINX_CONF").bak-douyin-mini-rpg"
              sudo python3 - "$NGINX_CONF" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            text = path.read_text()
            location = r'''

                location ^~ /game/douyin-mini-rpg/assets/ {
                    alias /var/www/game/douyin-mini-rpg/assets/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/ {
                    alias /var/www/game/douyin-mini-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
                }
            '''

            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/assets/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            text = re.sub(r'\n\s*location\s+(?:=\s+|\^~\s+)?/game/douyin-mini-rpg/?\s*\{.*?\n\s*\}', '', text, flags=re.S)
            pattern = re.compile(r'(^\s*server_name\s+[^;]*mcp\.edcedc\.cn[^;]*;\s*$)', re.M)
            if not pattern.search(text):
                raise SystemExit('mcp.edcedc.cn server_name not found')
            text = pattern.sub(r'\1' + location, text, count=1)
            path.write_text(text)
            PY
              echo "Patched $NGINX_CONF"
            done < "$NGINX_CONFS"
            rm -f "$NGINX_CONFS"

            sudo nginx -t
            sudo nginx -s reload || true
            echo "Routed mcp.edcedc.cn/game/douyin-mini-rpg/ to /var/www/game/douyin-mini-rpg"
            curl -I -H 'Host: mcp.edcedc.cn' http://127.0.0.1/game/douyin-mini-rpg/
            EXPECTED_JS="$(grep -oE 'index-[^"]+\.js' /var/www/game/douyin-mini-rpg/index.html | head -n 1)"
            HOST_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://127.0.0.1/game/douyin-mini-rpg/?deploy-check=1)"
            echo "$HOST_HTML" | grep -F "$EXPECTED_JS"
            PUBLIC_HOST_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://122.51.245.220/game/douyin-mini-rpg/?deploy-check=1)"
            echo "$PUBLIC_HOST_HTML" | grep -F "$EXPECTED_JS"
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://127.0.0.1/game/douyin-mini-rpg/assets/generated/world-moss-hills.webp | tee /tmp/douyin-mini-rpg-asset.headers
            grep -qi 'content-type: image/webp' /tmp/douyin-mini-rpg-asset.headers
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://122.51.245.220/game/douyin-mini-rpg/assets/generated/world-moss-hills.webp | tee /tmp/douyin-mini-rpg-public-asset.headers
            grep -qi 'content-type: image/webp' /tmp/douyin-mini-rpg-public-asset.headers
