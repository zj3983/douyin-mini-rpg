name: Deploy to Cloud Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  DEPLOY_HOST: 81.69.45.16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image-test dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Package checked Cocos build
        run: |
          npm ci
          npm test
          cd cocos-client
          npm test
          COCOS_CREATOR_PATH=prebuilt npm run build:check
          COCOS_CREATOR_PATH=prebuilt npm run verify:build-output -- build/web-mobile
          cd ..

      - name: Checkout release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 5m
          script: |
            set -e
            rm -rf /tmp/douyin-mini-rpg-app
            git clone --depth 1 --branch main https://github.com/zj3983/douyin-mini-rpg.git /tmp/douyin-mini-rpg-app
            test "$(git -C /tmp/douyin-mini-rpg-app rev-parse HEAD)" = "${{ github.sha }}"

      - name: Deploy archive and route domain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/var/www/game/douyin-mini-rpg"
            SERVER_DIR="/var/www/game/douyin-mini-rpg-server"
            GAME_HUB_DIR="/var/www/games-prefix"
            LEGACY_GAME_DIR="/var/www/game/relaxed-sheep-match"
            LEGACY_PREFIX_DIR="/var/www/games-prefix/relaxed-sheep-match"

            sudo rm -rf "$APP_DIR"
            sudo mkdir -p "$APP_DIR" "$SERVER_DIR" "$GAME_HUB_DIR"
            sudo cp -R /tmp/douyin-mini-rpg-app/cocos-client/build/web-mobile/. "$APP_DIR/"
            sudo chown -R www-data:www-data "$APP_DIR" || true

            sudo rm -rf "$LEGACY_GAME_DIR" "$LEGACY_PREFIX_DIR"
            sudo tee "$GAME_HUB_DIR/index.html" > /dev/null <<'HTML'
            <!doctype html>
            <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Void Trial</title>
              <style>
                body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06111b;color:#eef7ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
                main{width:min(760px,calc(100vw - 32px));padding:28px}
                a{display:block;text-decoration:none;color:inherit;border:1px solid rgba(125,219,255,.35);border-radius:14px;background:rgba(6,17,27,.86);box-shadow:0 22px 70px rgba(0,0,0,.35)}
                .body{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
                .name{font-size:24px;font-weight:900}.go{color:#8df4ff;font-weight:800}
                p{margin:0 0 18px;color:#b9d7e7}
              </style>
            </head>
            <body>
              <main>
                <p>Current game entry</p>
                <a href="/game/douyin-mini-rpg/">
                  <div class="body"><span class="name">Void Trial</span><span class="go">Enter</span></div>
                </a>
              </main>
            </body>
            </html>
            HTML
            sudo chown www-data:www-data "$GAME_HUB_DIR/index.html" || true

            if [ -d "$LEGACY_GAME_DIR" ] || [ -d "$LEGACY_PREFIX_DIR" ]; then
              echo "Legacy game files still exist"
              exit 1
            fi

            sudo rm -rf "$SERVER_DIR/server"
            sudo cp -R /tmp/douyin-mini-rpg-app/server "$SERVER_DIR/server"
            sudo cp /tmp/douyin-mini-rpg-app/package.json /tmp/douyin-mini-rpg-app/package-lock.json "$SERVER_DIR/"
            sudo mkdir -p "$SERVER_DIR/data"
            sudo chown -R ubuntu:ubuntu "$SERVER_DIR"

            sudo tee /etc/systemd/system/douyin-mini-rpg-api.service > /dev/null <<'SERVICE'
            [Unit]
            Description=Douyin Mini RPG Account API
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/var/www/game/douyin-mini-rpg-server
            Environment=NODE_ENV=production
            Environment=PORT=4174
            Environment=AUTH_DATA_FILE=/var/www/game/douyin-mini-rpg-server/data/auth.json
            ExecStart=/usr/bin/node server/index.js
            Restart=always
            RestartSec=3
            User=ubuntu

            [Install]
            WantedBy=multi-user.target
            SERVICE
            sudo systemctl daemon-reload
            sudo systemctl enable douyin-mini-rpg-api.service
            sudo systemctl restart douyin-mini-rpg-api.service
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4174/api/health | grep -F '"ok":true'; then
                break
              fi
              if [ "$i" = "20" ]; then
                sudo systemctl --no-pager status douyin-mini-rpg-api.service
                exit 1
              fi
              sleep 1
            done

            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf /etc/nginx/conf.d/00-douyin-mini-rpg-live.conf
            sudo find /etc/nginx -type f -name '*.bak-douyin-mini-rpg' -delete

            NGINX_CONFS="$(mktemp)"
            sudo find /etc/nginx/conf.d /etc/nginx/sites-enabled -maxdepth 1 \( -type f -o -type l \) -print | sort -u > "$NGINX_CONFS"

            PATCHED_SERVERS=0
            while IFS= read -r NGINX_CONF; do
              sudo cp "$NGINX_CONF" "/tmp/$(basename "$NGINX_CONF").bak-douyin-mini-rpg"
              if PATCHED_IN_FILE="$(sudo python3 - "$NGINX_CONF" <<'PY'
            from pathlib import Path
            from collections import namedtuple
            import sys

            Token = namedtuple('Token', 'kind value start end')
            target_domain = 'mcp.edcedc.cn'
            managed_name = 'douyin-mini-rpg compression'
            begin_marker = '# BEGIN ' + managed_name
            end_marker = '# END ' + managed_name
            target_routes = {
                '/game/douyin-mini-rpg/assets/',
                '/game/douyin-mini-rpg/cocos-js/',
                '/game/douyin-mini-rpg/src/',
                '/game/douyin-mini-rpg/api/',
                '/game/douyin-mini-rpg/',
            }
            compression = r'''

                # BEGIN douyin-mini-rpg compression
                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_comp_level 6;
                gzip_min_length 1024;
                gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml application/wasm;
                # END douyin-mini-rpg compression
            '''
            location = r'''

                location ^~ /game/douyin-mini-rpg/assets/ {
                    alias /var/www/game/douyin-mini-rpg/assets/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/cocos-js/ {
                    alias /var/www/game/douyin-mini-rpg/cocos-js/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/src/ {
                    alias /var/www/game/douyin-mini-rpg/src/;
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/api/ {
                    proxy_pass http://127.0.0.1:4174/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ^~ /game/douyin-mini-rpg/ {
                    alias /var/www/game/douyin-mini-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
                }
            '''

            def tokenize(source):
                tokens = []
                index = 0
                while index < len(source):
                    char = source[index]
                    if char.isspace():
                        index += 1
                        continue
                    if char == '#':
                        end = source.find('\n', index)
                        end = len(source) if end < 0 else end
                        tokens.append(Token('comment', source[index:end], index, end))
                        index = end
                        continue
                    if char in "'\"":
                        start = index
                        quote = char
                        index += 1
                        value = []
                        while index < len(source):
                            if source[index] == '\\':
                                if index + 1 >= len(source):
                                    raise ValueError('unterminated escape in nginx quoted string')
                                value.append(source[index + 1])
                                index += 2
                            elif source[index] == quote:
                                index += 1
                                tokens.append(Token('quoted', ''.join(value), start, index))
                                break
                            else:
                                value.append(source[index])
                                index += 1
                        else:
                            raise ValueError('unterminated quoted string in nginx config')
                        continue
                    if char in '{};':
                        tokens.append(Token(char, char, index, index + 1))
                        index += 1
                        continue

                    start = index
                    value = []
                    while index < len(source) and not source[index].isspace() and source[index] not in "#{};'\"":
                        if source[index] == '\\':
                            if index + 1 >= len(source):
                                raise ValueError('unterminated escape in nginx token')
                            value.append(source[index + 1])
                            index += 2
                        else:
                            value.append(source[index])
                            index += 1
                    if not value:
                        raise ValueError(f'unexpected nginx character at byte {index}')
                    tokens.append(Token('bare', ''.join(value), start, index))
                return tokens

            def next_significant(tokens, index, limit=None):
                limit = len(tokens) if limit is None else limit
                while index < limit and tokens[index].kind == 'comment':
                    index += 1
                return index

            def matching_brace(tokens, opening, limit=None):
                limit = len(tokens) if limit is None else limit
                depth = 0
                for index in range(opening, limit):
                    if tokens[index].kind == '{':
                        depth += 1
                    elif tokens[index].kind == '}':
                        depth -= 1
                        if depth == 0:
                            return index
                raise ValueError('unbalanced nginx block')

            def server_spans(source):
                tokens = tokenize(source)
                spans = []
                index = 0
                while index < len(tokens):
                    token = tokens[index]
                    if token.kind == 'bare' and token.value == 'server':
                        opening = next_significant(tokens, index + 1)
                        if opening < len(tokens) and tokens[opening].kind == '{':
                            closing = matching_brace(tokens, opening)
                            spans.append((token.start, tokens[closing].end))
                            index = closing + 1
                            continue
                    index += 1
                return spans

            def outer_server(tokens):
                index = next_significant(tokens, 0)
                if index >= len(tokens) or tokens[index].kind != 'bare' or tokens[index].value != 'server':
                    raise ValueError('expected nginx server block')
                opening = next_significant(tokens, index + 1)
                if opening >= len(tokens) or tokens[opening].kind != '{':
                    raise ValueError('expected opening brace for nginx server')
                return opening, matching_brace(tokens, opening)

            def top_level_statements(source):
                tokens = tokenize(source)
                opening, closing = outer_server(tokens)
                statements = []
                index = opening + 1
                while index < closing:
                    index = next_significant(tokens, index, closing)
                    if index >= closing:
                        break
                    start = index
                    cursor = index
                    while cursor < closing:
                        token = tokens[cursor]
                        if token.kind == ';':
                            header = [item for item in tokens[start:cursor] if item.kind != 'comment']
                            statements.append(('directive', header, tokens[start].start, token.end))
                            index = cursor + 1
                            break
                        if token.kind == '{':
                            block_end = matching_brace(tokens, cursor, closing + 1)
                            header = [item for item in tokens[start:cursor] if item.kind != 'comment']
                            statements.append(('block', header, tokens[start].start, tokens[block_end].end))
                            index = block_end + 1
                            break
                        cursor += 1
                    else:
                        raise ValueError('unterminated nginx directive in server block')
                return tokens, opening, closing, statements

            def matching_server_name(source):
                _, _, _, statements = top_level_statements(source)
                for kind, header, start, end in statements:
                    if kind != 'directive' or not header:
                        continue
                    if header[0].kind == 'bare' and header[0].value == 'server_name':
                        if any(token.kind in {'bare', 'quoted'} and token.value == target_domain for token in header[1:]):
                            return start, end
                return None

            def top_level_comments(source):
                tokens = tokenize(source)
                opening, closing = outer_server(tokens)
                depth = 0
                comments = []
                for token in tokens[opening + 1:closing]:
                    if token.kind == '{':
                        depth += 1
                    elif token.kind == '}':
                        depth -= 1
                    elif token.kind == 'comment' and depth == 0:
                        comments.append(token)
                return comments

            def expanded_line_span(source, start, end):
                line_start = source.rfind('\n', 0, start) + 1
                if not source[line_start:start].strip():
                    remove_start = line_start
                    while remove_start > 0:
                        previous_end = remove_start - 1
                        previous_start = source.rfind('\n', 0, previous_end) + 1
                        if source[previous_start:previous_end].strip():
                            break
                        remove_start = previous_start
                else:
                    remove_start = start

                line_end = source.find('\n', end)
                remove_end = end
                if line_end >= 0 and not source[end:line_end].strip():
                    remove_end = line_end + 1
                    while remove_end < len(source):
                        next_end = source.find('\n', remove_end)
                        if next_end < 0:
                            if not source[remove_end:].strip():
                                remove_end = len(source)
                            break
                        if source[remove_end:next_end].strip():
                            break
                        remove_end = next_end + 1
                return remove_start, remove_end

            def remove_spans(source, spans):
                merged = []
                for start, end in sorted(spans):
                    if merged and start <= merged[-1][1]:
                        merged[-1] = (merged[-1][0], max(merged[-1][1], end))
                    else:
                        merged.append((start, end))
                for start, end in reversed(merged):
                    source = source[:start] + source[end:]
                return source

            def remove_managed_blocks(source):
                spans = []
                opening = None
                for comment in top_level_comments(source):
                    marker = comment.value.strip()
                    if marker == begin_marker:
                        if opening is not None:
                            raise ValueError('nested managed compression marker')
                        opening = comment.start
                    elif marker == end_marker and opening is not None:
                        spans.append(expanded_line_span(source, opening, comment.end))
                        opening = None
                if opening is not None:
                    raise ValueError('unterminated managed compression marker')
                return remove_spans(source, spans)

            def target_location(header):
                if not header or header[0].kind != 'bare' or header[0].value != 'location':
                    return False
                if len(header) == 2 and header[1].kind in {'bare', 'quoted'}:
                    return header[1].value in target_routes
                if (
                    len(header) == 3
                    and header[1].kind == 'bare'
                    and header[1].value in {'=', '^~'}
                    and header[2].kind in {'bare', 'quoted'}
                ):
                    return header[2].value in target_routes
                return False

            def remove_target_locations(source):
                _, _, _, statements = top_level_statements(source)
                spans = [
                    expanded_line_span(source, start, end)
                    for kind, header, start, end in statements
                    if kind == 'block' and target_location(header)
                ]
                return remove_spans(source, spans)

            def patch_server(source):
                source = remove_managed_blocks(source)
                source = remove_target_locations(source)
                server_name = matching_server_name(source)
                if server_name is None:
                    raise ValueError('matching server_name disappeared during patch')
                insert_at = server_name[1]
                content_at = insert_at
                while content_at < len(source) and source[content_at].isspace():
                    content_at += 1
                whitespace = source[insert_at:content_at]
                indentation = whitespace.rsplit('\n', 1)[-1] if '\n' in whitespace else whitespace
                return source[:insert_at] + compression + location + indentation + source[content_at:]

            path = Path(sys.argv[1])
            text = path.read_bytes().decode('utf-8')
            matching_spans = [
                (start, end)
                for start, end in server_spans(text)
                if matching_server_name(text[start:end]) is not None
            ]
            if not matching_spans:
                print('mcp.edcedc.cn server_name not found', file=sys.stderr)
                raise SystemExit(3)

            for start, end in reversed(matching_spans):
                text = text[:start] + patch_server(text[start:end]) + text[end:]

            path.write_bytes(text.encode('utf-8'))
            print(len(matching_spans))
            PY
              )"; then
                PATCHED_SERVERS=$((PATCHED_SERVERS + PATCHED_IN_FILE))
                echo "Patched $PATCHED_IN_FILE server block(s) in $NGINX_CONF"
              else
                PATCH_STATUS=$?
                if [ "$PATCH_STATUS" -eq 3 ]; then
                  echo "Skipped $NGINX_CONF (no exact mcp.edcedc.cn server_name token)"
                else
                  exit "$PATCH_STATUS"
                fi
              fi
            done < "$NGINX_CONFS"
            rm -f "$NGINX_CONFS"
            if [ "$PATCHED_SERVERS" -eq 0 ]; then
              echo "No existing mcp.edcedc.cn server block found"
              exit 1
            fi

            sudo nginx -t
            sudo nginx -s reload || true

            JS_FILE="$(find "$APP_DIR/cocos-js" -type f -name '*.js' -printf '%s\t%P\n' | sort -nr | head -n 1 | cut -f2-)"
            if [ -z "$JS_FILE" ]; then
              echo "No deployed cocos-js JavaScript file found"
              exit 1
            fi
            JS_URL="/game/douyin-mini-rpg/cocos-js/$JS_FILE"
            GZIP_HEADERS="$(mktemp)"
            trap 'rm -f "$GZIP_HEADERS"' EXIT
            curl -fsS -D "$GZIP_HEADERS" -o /dev/null -H 'Host: mcp.edcedc.cn' -H 'Accept-Encoding: gzip' "http://${{ env.DEPLOY_HOST }}$JS_URL"
            grep -qiE '^Content-Encoding:[[:space:]]*gzip([[:space:]]|\r)*$' "$GZIP_HEADERS"
            grep -qiE '^Vary:.*Accept-Encoding' "$GZIP_HEADERS"
            grep -qiE '^Cache-Control:.*public.*max-age=2592000.*immutable' "$GZIP_HEADERS"
            rm -f "$GZIP_HEADERS"
            trap - EXIT

            PUBLIC_HOST_HTML="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/?deploy-check=1)"
            echo "$PUBLIC_HOST_HTML" | grep -F 'Cocos3dGameContainer'
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/style.css | grep -qi 'content-type: text/css'
            curl -fsSI -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/src/settings.json | grep -qi 'content-type: application/json'
            PUBLIC_GAME_HUB="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/?deploy-check=1)"
            echo "$PUBLIC_GAME_HUB" | grep -F 'Void Trial'
            if echo "$PUBLIC_GAME_HUB" | grep -F 'relaxed-sheep-match'; then
              echo "Legacy game entry still present"
              exit 1
            fi
            LEGACY_PUBLIC_PAGE="$(curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/relaxed-sheep-match/?deploy-check=1 || true)"
            if echo "$LEGACY_PUBLIC_PAGE" | grep -E 'Relaxed Sheep Match|relaxed-sheep-match'; then
              echo "Legacy game content still reachable"
              exit 1
            fi
            for i in $(seq 1 20); do
              if curl -fsS -H 'Host: mcp.edcedc.cn' http://${{ env.DEPLOY_HOST }}/game/douyin-mini-rpg/api/health | grep -F '"ok":true'; then
                break
              fi
              if [ "$i" = "20" ]; then
                exit 1
              fi
              sleep 1
            done
            echo "Deployed Cocos archive to $APP_DIR on ${{ env.DEPLOY_HOST }}"
