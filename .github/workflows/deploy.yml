name: Deploy to Cloud Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: |
            sudo mkdir -p /var/www/douyin-rpg
            sudo chown ubuntu:ubuntu /var/www/douyin-rpg

      - name: Deploy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          source: "dist/"
          target: "/var/www/douyin-rpg"
          strip_components: 1

      - name: Configure nginx and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: |
            sudo tee /etc/nginx/conf.d/douyin-rpg.conf > /dev/null <<'NGINX'
            server {
                listen 80;
                server_name mcp.edcedc.cn;

                location /game/ {
                    alias /var/www/douyin-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/index.html;
                }
            }
            NGINX
            sudo nginx -t && sudo nginx -s reload
            echo "Deployed! Visit http://122.51.245.220/game/"
