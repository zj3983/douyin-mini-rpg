name: Deploy to Cloud Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Route live domain to deployed game
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 122.51.245.220
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 5m
          script: |
            set -e

            test -f /var/www/game/douyin-mini-rpg/index.html
            sudo rm -f /etc/nginx/conf.d/douyin-rpg.conf /etc/nginx/conf.d/00-douyin-mini-rpg-live.conf
            sudo rm -f /etc/nginx/sites-enabled/*.bak-douyin-mini-rpg /etc/nginx/conf.d/*.bak-douyin-mini-rpg

            NGINX_CONF="$(sudo grep -RslE '^[[:space:]]*server_name[[:space:]].*mcp\.edcedc\.cn' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)"
            if [ -z "$NGINX_CONF" ]; then
              echo "No existing mcp.edcedc.cn config found"
              exit 1
            fi
            sudo cp "$NGINX_CONF" "/tmp/$(basename "$NGINX_CONF").bak-douyin-mini-rpg"
            sudo python3 - "$NGINX_CONF" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            text = path.read_text()
            location = r'''

                location ^~ /game/douyin-mini-rpg/assets/ {
                    alias /var/www/game/douyin-mini-rpg/assets/;
                    access_log off;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000, immutable";
                    try_files $uri =404;
                }

                location ^~ /game/douyin-mini-rpg/ {
                    alias /var/www/game/douyin-mini-rpg/;
                    index index.html;
                    try_files $uri $uri/ /game/douyin-mini-rpg/index.html;
                }
            '''

            text = re.sub(r'\n\s*location\s+\^~\s+/game/douyin-mini-rpg/assets/\s*\{.*?\n\s*\}', '', text, flags=re.S)
            text = re.sub(r'\n\s*location\s+\^~\s+/game/douyin-mini-rpg/\s*\{.*?\n\s*\}', '', text, flags=re.S)
            pattern = re.compile(r'(^\s*server_name\s+[^;]*mcp\.edcedc\.cn[^;]*;\s*$)', re.M)
            if not pattern.search(text):
                raise SystemExit('mcp.edcedc.cn server_name not found')
            text = pattern.sub(r'\1' + location, text, count=1)
            path.write_text(text)
            PY
            echo "Patched $NGINX_CONF"

            sudo nginx -t
            sudo nginx -s reload || true
            echo "Routed mcp.edcedc.cn/game/douyin-mini-rpg/ to /var/www/game/douyin-mini-rpg"
            curl -I -H 'Host: mcp.edcedc.cn' http://127.0.0.1/game/douyin-mini-rpg/
